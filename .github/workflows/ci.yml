name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt build
      - run: PYTHONPATH=packages/python python -m pytest tests -q
      - run: python -m compileall -q server.py runtime packages/python
      - run: python -m build --wheel --sdist packages/python

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm ci
        working-directory: packages/typescript
      - run: npm run typecheck
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript
      - run: npm pack --dry-run
        working-directory: packages/typescript

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --pull=false -t dsh-workbench:ci .
