openapi: 3.1.0
info:
  title: DSH Workbench API
  version: 1.0.0
  description: Public contract for the open-source AI Task Platform.
servers:
  - url: http://localhost:8766
    description: Local reference service
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Tasks
  - name: Runs
  - name: Knowledge
  - name: Workflows
  - name: Approvals
  - name: Artifacts
  - name: Chat
paths:
  /api/v1/health:
    get:
      security: []
      tags: [System]
      operationId: getHealth
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema: {type: object}
  /api/v1/ready:
    get:
      security: []
      tags: [System]
      operationId: getReady
      responses:
        '200':
          description: Storage and runtime readiness
          content:
            application/json:
              schema: {type: object}
  /api/v1/runtime:
    get:
      tags: [System]
      operationId: getRuntime
      responses:
        '200':
          description: Runtime capabilities and policy
          content:
            application/json:
              schema: {type: object}
  /api/v1/dashboard:
    get:
      tags: [System]
      operationId: getDashboard
      responses:
        '200':
          description: Workspace dashboard
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/scenario-packs:
    get:
      tags: [System]
      operationId: listScenarioPacks
      responses:
        '200':
          description: Scenario packs
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /api/v1/skills:
    get:
      tags: [System]
      operationId: listSkills
      responses:
        '200':
          description: Registered skills
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /api/v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Task'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Tasks]
      operationId: createTask
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/Idempotency-Key'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pack_id, skill_id]
              properties:
                name: {type: string}
                pack_id: {type: string}
                skill_id: {type: string}
                input: {}
      responses:
        '201':
          description: Created task
          content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /api/v1/tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getTask
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
      responses:
        '200':
          description: Task detail
          content: {application/json: {schema: {type: object}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/tasks/{task_id}/runs:
    post:
      tags: [Runs]
      operationId: runTask
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/Idempotency-Key'}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {input: {}}}
      responses:
        '201':
          description: Queued run
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/tasks/{task_id}/artifacts:
    get:
      tags: [Artifacts]
      operationId: listTaskArtifacts
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
      responses:
        '200':
          description: Task artifacts
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Artifact'}}}}
  /api/v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
      responses:
        '200':
          description: Run history
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Run'}}}}
  /api/v1/runs/{run_id}:
    get:
      tags: [Runs]
      operationId: getRun
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Run
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runs/{run_id}/callback:
    post:
      tags: [Runs]
      operationId: callbackRun
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/CallbackTimestamp'}
        - {$ref: '#/components/parameters/CallbackSignature'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/RunStatus'}
                message: {type: string}
                artifacts: {type: array, items: {$ref: '#/components/schemas/Artifact'}}
      responses:
        '200':
          description: Updated run
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Validation'}
  /api/v1/queue:
    get:
      tags: [Runs]
      operationId: getQueueStatus
      responses:
        '200':
          description: Queue and concurrency status
          content: {application/json: {schema: {type: object}}}
  /api/v1/runs/{run_id}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Cancel request accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runs/{run_id}/retry:
    post:
      tags: [Runs]
      operationId: retryRun
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: Run requeued, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/knowledge:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeSources
      responses:
        '200':
          description: Knowledge source metadata
          content: {application/json: {schema: {type: array, items: {type: object}}}}
  /api/v1/knowledge/sources:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeSourcesDetailed
      responses:
        '200': {description: Sources and indexed chunk counts, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      tags: [Knowledge]
      operationId: ingestKnowledgeSource
      parameters: [{$ref: '#/components/parameters/Idempotency-Key'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                source_id: {type: string}
                document_id: {type: string}
                name: {type: string}
                pack_id: {type: string}
                content: {type: string}
                metadata: {type: object}
      responses:
        '201': {description: Indexed document and chunks, content: {application/json: {schema: {type: object}}}}
  /api/v1/knowledge/ingest:
    post:
      tags: [Knowledge]
      operationId: ingestKnowledgeDocument
      parameters: [{$ref: '#/components/parameters/Idempotency-Key'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, content]}}}
      responses:
        '201': {description: Indexed document, content: {application/json: {schema: {type: object}}}}
  /api/v1/knowledge/citations:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeCitations
      responses:
        '200': {description: Citation records, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /api/v1/knowledge/search:
    post:
      tags: [Knowledge]
      operationId: searchKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string}
                pack_id: {type: string}
                top_k: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Evidence matches
          content: {application/json: {schema: {type: object}}}
  /api/v1/chat/messages:
    post:
      tags: [Chat]
      operationId: sendChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string}
                pack_id: {type: string}
                conversation_id: {type: string}
      responses:
        '201':
          description: Chat response
          content: {application/json: {schema: {type: object}}}
  /api/v1/org/members:
    get:
      tags: [Organization]
      operationId: listOrganizationMembers
      responses:
        '200': {description: Organization members, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      tags: [Organization]
      operationId: inviteOrganizationMember
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}, role: {type: string}}}}}
      responses:
        '201': {description: Invited member, content: {application/json: {schema: {type: object}}}}
  /api/v1/scenario-packs/{pack_id}/evaluations:
    get:
      tags: [Scenario Packs]
      operationId: listScenarioPackEvaluations
      parameters: [{name: pack_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Evaluation history, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      tags: [Scenario Packs]
      operationId: evaluateScenarioPack
      parameters: [{name: pack_id, in: path, required: true, schema: {type: string}}]
      responses:
        '201': {description: Evaluation result, content: {application/json: {schema: {type: object}}}}
  /api/v1/workflows:
    get:
      tags: [Runs]
      operationId: listWorkflows
      responses:
        '200':
          description: Workflows
          content: {application/json: {schema: {type: array, items: {type: object}}}}
  /api/v1/workflows/{workflow_id}/runs:
    post:
      tags: [Runs]
      operationId: runWorkflow
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/Idempotency-Key'}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {input: {}}}
      responses:
        '201':
          description: Queued workflow run
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
  /api/v1/skill-runs:
    post:
      tags: [Runs]
      operationId: runSkill
      parameters:
        - {$ref: '#/components/parameters/Idempotency-Key'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_id]
              properties:
                skill_id: {type: string}
                input: {}
      responses:
        '201':
          description: Queued skill run
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
  /api/v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      responses:
        '200':
          description: Approval queue
          content: {application/json: {schema: {type: array, items: {type: object}}}}
  /api/v1/approvals/{task_id}/approve:
    post:
      tags: [Approvals]
      operationId: approveTask
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
      responses:
        '200':
          description: Approval result
          content: {application/json: {schema: {type: object}}}
  /api/v1/approvals/{task_id}/reject:
    post:
      tags: [Approvals]
      operationId: rejectTask
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
      responses:
        '200':
          description: Rejection result
          content: {application/json: {schema: {type: object}}}
  /api/v1/artifacts:
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
      responses:
        '200':
          description: Artifact catalogue
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Artifact'}}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId: {name: task_id, in: path, required: true, schema: {type: string}}
    RunId: {name: run_id, in: path, required: true, schema: {type: string}}
    WorkflowId: {name: workflow_id, in: path, required: true, schema: {type: string}}
    RequestId: {name: X-Request-ID, in: header, required: false, schema: {type: string}}
    Idempotency-Key: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 200}}
    CallbackTimestamp: {name: X-DSH-Timestamp, in: header, required: false, schema: {type: string}}
    CallbackSignature: {name: X-DSH-Signature, in: header, required: false, schema: {type: string}}
    PageSize: {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
    PageToken: {name: page_token, in: query, required: false, schema: {type: string}}
  schemas:
    Task: {$ref: './schemas/task.json'}
    Run: {$ref: './schemas/run.json'}
    Artifact:
      type: object
      required: [name, type]
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string}
        description: {type: string}
        task_id: {type: string}
        run_id: {type: string}
        uri: {type: string}
    RunStatus: {$ref: './schemas/run.json#/properties/status'}
    Event: {$ref: './schemas/event.json'}
    ErrorEnvelope: {$ref: './schemas/error.json'}
  responses:
    Unauthorized:
      description: Authentication required
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    NotFound:
      description: Resource not found
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Conflict:
      description: Idempotency conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Validation:
      description: Validation error
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
