services:
  dsh-workbench:
    build: .
    ports:
      - "8766:8766"
    environment:
      WORKBENCH_AUTH_TOKEN: ${WORKBENCH_AUTH_TOKEN:-}
      DSH_RUNTIME_MODE: ${DSH_RUNTIME_MODE:-auto}
      DSH_HARNESS_HOME: ${DSH_HARNESS_HOME:-}
      DSH_HARNESS_PROFILE: ${DSH_HARNESS_PROFILE:-workbench-readonly}
      DSH_HARNESS_WORKSPACE: ${DSH_HARNESS_WORKSPACE:-}
      DSH_ENDPOINT: ${DSH_ENDPOINT:-}
      DSH_CALLBACK_URL: ${DSH_CALLBACK_URL:-}
      DSH_CALLBACK_SECRET: ${DSH_CALLBACK_SECRET:-}
      DSH_CALLBACK_MAX_SKEW: ${DSH_CALLBACK_MAX_SKEW:-300}
      DSH_HARNESS_PATCHES: ${DSH_HARNESS_PATCHES:-}
      DSH_PROVIDER: ${DSH_PROVIDER:-}
      DSH_MODEL: ${DSH_MODEL:-}
      DSH_REASONING_EFFORT: ${DSH_REASONING_EFFORT:-}
      DSH_MAX_TOKENS: ${DSH_MAX_TOKENS:-}
      WORKBENCH_STORAGE: ${WORKBENCH_STORAGE:-sqlite}
    volumes:
      - workbench-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  workbench-data:
