[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-workbench"
version = "0.1.0"
description = "Python SDK for the open-source DSH Workbench AI Task Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Yuhang Wu"}]
license = {text = "Apache-2.0"}
keywords = ["ai", "agents", "workflow", "knowledge-base", "task-platform"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = []

[project.optional-dependencies]
harness = ["deepseek-harness-sdk>=0.1.0"]
[project.urls]
Homepage = "https://github.com/yuhangwu97/dsh-workbench"
Documentation = "https://github.com/yuhangwu97/dsh-workbench/tree/main/docs"
Repository = "https://github.com/yuhangwu97/dsh-workbench"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
